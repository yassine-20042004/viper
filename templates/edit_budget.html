{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Modifier le Budget</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="category_id" class="form-label">Catégorie</label>
                            <select class="form-select" id="category_id" name="category_id" required>
                                <option value="">Choisir une catégorie...</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}" {% if category.id == budget.category_id %}selected{% endif %}>
                                    {{ category.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label">Montant</label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" class="form-control" id="amount" name="amount" 
                                       step="0.01" min="0" value="{{ budget.amount }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="start_date" class="form-label">Date de début</label>
                                <input type="date" class="form-control" id="start_date" name="start_date" 
                                       value="{{ budget.start_date }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="end_date" class="form-label">Date de fin</label>
                                <input type="date" class="form-control" id="end_date" name="end_date" 
                                       value="{{ budget.end_date }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="recurrent" class="form-label">Récurrence</label>
                            <select class="form-select" id="recurrent" name="recurrent">
                                <option value="no" {% if budget.recurrent == 'no' %}selected{% endif %}>Pas de récurrence</option>
                                <option value="monthly" {% if budget.recurrent == 'monthly' %}selected{% endif %}>Mensuel</option>
                                <option value="quarterly" {% if budget.recurrent == 'quarterly' %}selected{% endif %}>Trimestriel</option>
                                <option value="yearly" {% if budget.recurrent == 'yearly' %}selected{% endif %}>Annuel</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="notification" class="form-label">Notifications</label>
                            <select class="form-select" id="notification" name="notification">
                                <option value="none" {% if budget.notification == 'none' %}selected{% endif %}>Aucune notification</option>
                                <option value="50" {% if budget.notification == '50' %}selected{% endif %}>À 50% du budget</option>
                                <option value="80" {% if budget.notification == '80' %}selected{% endif %}>À 80% du budget</option>
                                <option value="100" {% if budget.notification == '100' %}selected{% endif %}>À 100% du budget</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Enregistrer les Modifications
                            </button>
                            <a href="{{ url_for('budgets') }}" class="btn btn-secondary">
                                <i class="fas fa-times me-2"></i>Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
