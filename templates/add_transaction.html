{% extends "base.html" %}

{% block title %}Ajouter une transaction - Personal Finance Manager{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-plus-circle me-2"></i>Ajouter une transaction
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('add_transaction') }}">
                        <div class="mb-3">
                            <label for="account_id" class="form-label">Compte</label>
                            <select class="form-select" id="account_id" name="account_id" required>
                                <option value="">Sélectionnez un compte</option>
                                {% for account in accounts %}
                                <option value="{{ account.id }}">{{ account.name }} (Solde: {{ account.current_balance }} {{ account.currency }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="category_id" class="form-label">Catégorie</label>
                            <select class="form-select" id="category_id" name="category_id" required>
                                <option value="">Sélectionnez une catégorie</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.icon }} {{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label">Montant</label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" class="form-control" id="amount" name="amount" 
                                       step="0.01" required placeholder="0.00">
                                <div class="form-text text-muted">
                                    Utilisez un nombre négatif pour les dépenses (ex: -50.00)
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <input type="text" class="form-control" id="description" name="description" 
                                   required placeholder="Ex: Courses au supermarché">
                        </div>

                        <div class="mb-3">
                            <label for="payment_method" class="form-label">Moyen de paiement</label>
                            <select class="form-select" id="payment_method" name="payment_method">
                                <option value="card">Carte bancaire</option>
                                <option value="cash">Espèces</option>
                                <option value="transfer">Virement</option>
                                <option value="check">Chèque</option>
                                <option value="other">Autre</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Enregistrer la transaction
                            </button>
                            <a href="{{ url_for('transactions') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-2"></i>Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
